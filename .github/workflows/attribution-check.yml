name: Attribution
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
permissions:
  contents: read
jobs:
  attribution:
    uses: foss-earth/ci/.github/workflows/attribution.yml@1db73d1ddb342e348a2c9e8387f7bbc7ebb3225e
    with:
      validator-revision: 1db73d1ddb342e348a2c9e8387f7bbc7ebb3225e
      source-repository: ${{ github.repository }}
    permissions:
      contents: read
