<svg xmlns="http://www.w3.org/2000/svg" width="760" height="719" viewBox="0 0 760 719" role="img">
<style>
  :root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --quiet: #b5b3ab;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
    --s6: #008300;
    --s7: #4a3aa7;
    --s8: #e34948; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --quiet: #5c5b56;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s5: #d55181;
      --s6: #008300;
      --s7: #9085e9;
      --s8: #e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .subtitle { font-size: 12px; fill: var(--ink2); }
  .panel-title { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .value { font-size: 11.5px; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .note { font-size: 11px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text x="16" y="24" class="title" text-anchor="start">Decoding one 256 × 256 tile</text>
<text x="16" y="44" class="subtitle" text-anchor="start">Median time on this desktop CPU (Apple M5): Node for the JavaScript and WebAssembly rows, headless Chrome</text>
<text x="16" y="61" class="subtitle" text-anchor="start">for the browser's own decoders. Every row is timed in a loop, with the processor awake. A phone is slower by</text>
<text x="16" y="78" class="subtitle" text-anchor="start">a factor this benchmark did not measure.</text>
<line x1="316" y1="99" x2="316" y2="411" class="grid"/>
<text x="316" y="426" class="tick" text-anchor="middle">0</text>
<line x1="405.5" y1="99" x2="405.5" y2="411" class="grid"/>
<text x="405.5" y="426" class="tick" text-anchor="middle">0.4</text>
<line x1="495" y1="99" x2="495" y2="411" class="grid"/>
<text x="495" y="426" class="tick" text-anchor="middle">0.8</text>
<line x1="584.5" y1="99" x2="584.5" y2="411" class="grid"/>
<text x="584.5" y="426" class="tick" text-anchor="middle">1.2</text>
<line x1="674" y1="99" x2="674" y2="411" class="grid"/>
<text x="674" y="426" class="tick" text-anchor="middle">1.6</text>
<text x="308" y="115" class="" text-anchor="end">Residual tile, whole decode, JavaScript</text>
<path d="M316 103 H439.5 Q443.5 103 443.5 107 V115 Q443.5 119 439.5 119 H316 Z" fill="var(--s1)"><title>Residual tile, whole decode, JavaScript: 0.570 ms</title></path>
<text x="449.5" y="115" class="value" text-anchor="start">0.570 ms</text>
<text x="308" y="139" class="" text-anchor="end">Residual tile, whole decode, WebAssembly</text>
