<path d="M316 343 H467.51 Q471.51 343 471.51 347 V355 Q471.51 359 467.51 359 H316 Z" fill="var(--s1)"><title>WebP tile, browser's decoder: 0.695 ms</title></path>
<text x="477.51" y="355" class="value" text-anchor="start">0.695 ms</text>
<text x="308" y="379" class="" text-anchor="end">JPEG tile, jpeg-js (JavaScript)</text>
<path d="M316 367 H624.58 Q628.58 367 628.58 371 V379 Q628.58 383 624.58 383 H316 Z" fill="var(--s1)"><title>JPEG tile, jpeg-js (JavaScript): 1.40 ms</title></path>
<text x="634.58" y="379" class="value" text-anchor="start">1.40 ms</text>
<text x="308" y="403" class="" text-anchor="end">Copy a decoded tile into an atlas</text>
<path d="M316 391 H316 Q318.5 391 318.5 393.5 V404.5 Q318.5 407 316 407 H316 Z" fill="var(--s1)"><title>Copy a decoded tile into an atlas: 0.011 ms</title></path>
<text x="324.5" y="403" class="value" text-anchor="start">0.011 ms</text>
<line x1="316" y1="99" x2="316" y2="411" class="axis"/>
<text x="495" y="442" class="tick" text-anchor="middle">milliseconds per tile (65,536 samples)</text>
