<path d="M316 247 H321.7 Q325.7 247 325.7 251 V259 Q325.7 263 321.7 263 H316 Z" fill="var(--s1)"><title>· inverse transform, WebAssembly: 0.043 ms</title></path>
<text x="331.7" y="259" class="value" text-anchor="start">0.043 ms</text>
<text x="308" y="283" class="" text-anchor="end">· Y′CbCr to RGBA, JavaScript</text>
<path d="M316 271 H344.73 Q348.73 271 348.73 275 V283 Q348.73 287 344.73 287 H316 Z" fill="var(--s1)"><title>· Y′CbCr to RGBA, JavaScript: 0.146 ms</title></path>
<text x="354.73" y="283" class="value" text-anchor="start">0.146 ms</text>
<text x="308" y="307" class="" text-anchor="end">JPEG tile, browser's decoder</text>
<path d="M316 295 H360.11 Q364.11 295 364.11 299 V307 Q364.11 311 360.11 311 H316 Z" fill="var(--s1)"><title>JPEG tile, browser's decoder: 0.215 ms</title></path>
<text x="370.11" y="307" class="value" text-anchor="start">0.215 ms</text>
