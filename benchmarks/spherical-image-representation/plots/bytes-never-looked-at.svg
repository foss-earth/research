<text x="16" y="44" class="subtitle" text-anchor="start">Constrained mobile (2 Mbit/s, 100 ms). Bytes received during the trace, each file's bytes split by the share</text>
<text x="16" y="61" class="subtitle" text-anchor="start">of its cells that some moment's view covered. Cubemap except the last rows; mean of 3 panoramas.</text>
