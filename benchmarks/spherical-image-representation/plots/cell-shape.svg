<svg xmlns="http://www.w3.org/2000/svg" width="760" height="454" viewBox="0 0 760 454" role="img">
<style>
  :root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --quiet: #b5b3ab;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
    --s6: #008300;
    --s7: #4a3aa7;
    --s8: #e34948; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --quiet: #5c5b56;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s5: #d55181;
      --s6: #008300;
      --s7: #9085e9;
      --s8: #e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .subtitle { font-size: 12px; fill: var(--ink2); }
  .panel-title { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .value { font-size: 11.5px; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .note { font-size: 11px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text x="16" y="24" class="title" text-anchor="start">Cell shape and sample spacing</text>
<text x="16" y="44" class="subtitle" text-anchor="start">Two different things. Left: how elongated a cell is in its chart. Right: how many samples the lattice spends</text>
<text x="16" y="61" class="subtitle" text-anchor="start">for each sample an ideal hexagonal lattice would need to leave no direction farther from a sample. Band: 1st</text>
<text x="16" y="78" class="subtitle" text-anchor="start">to 99th percentile; dot: area-weighted mean.</text>
<text x="16" y="107" class="panel-title" text-anchor="start">Cell elongation in the chart</text>
<line x1="156" y1="117" x2="156" y2="357" class="axis"/>
<text x="156" y="372" class="tick" text-anchor="middle">1</text>
<line x1="213.33" y1="117" x2="213.33" y2="357" class="grid"/>
<text x="213.33" y="372" class="tick" text-anchor="middle">2</text>
<line x1="270.67" y1="117" x2="270.67" y2="357" class="grid"/>
<text x="270.67" y="372" class="tick" text-anchor="middle">3</text>
<line x1="328" y1="117" x2="328" y2="357" class="grid"/>
<text x="328" y="372" class="tick" text-anchor="middle">4</text>
<text x="148" y="133" class="" text-anchor="end">Equirectangular</text>
<rect x="156.01" y="125" width="171.99" height="8" rx="3" fill="var(--s1)"><title>Equirectangular: 1.57</title></rect>
<circle cx="188.73" cy="129" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="133" class="value" text-anchor="start">1.57</text>
<text x="148" y="157" class="" text-anchor="end">Cubemap</text>
<rect x="156.36" y="149" width="37.02" height="8" rx="3" fill="var(--s1)"><title>Cubemap: 1.22</title></rect>
<circle cx="168.69" cy="153" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="157" class="value" text-anchor="start">1.22</text>
<text x="148" y="181" class="" text-anchor="end">Equi-angular cube</text>
<rect x="156.23" y="173" width="35.14" height="8" rx="3" fill="var(--s1)"><title>Equi-angular cube: 1.22</title></rect>
<circle cx="168.69" cy="177" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="181" class="value" text-anchor="start">1.22</text>
<text x="148" y="205" class="" text-anchor="end">QSC cube</text>
<rect x="163.66" y="197" width="22.6" height="8" rx="3" fill="var(--s1)"><title>QSC cube: 1.33</title></rect>
<circle cx="174.85" cy="201" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="205" class="value" text-anchor="start">1.33</text>
<text x="148" y="229" class="" text-anchor="end">Octahedral (L1)</text>
<rect x="163" y="221" width="77.73" height="8" rx="3" fill="var(--s1)"><title>Octahedral (L1): 1.77</title></rect>
<circle cx="200.4" cy="225" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="229" class="value" text-anchor="start">1.77</text>
<text x="148" y="253" class="" text-anchor="end">Octahedral equal-area</text>
<rect x="174.9" y="245" width="85.31" height="8" rx="3" fill="var(--s1)"><title>Octahedral equal-area: 2.04</title></rect>
<circle cx="215.83" cy="249" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="253" class="value" text-anchor="start">2.04</text>
<text x="148" y="277" class="" text-anchor="end">TOAST</text>
<rect x="156.74" y="269" width="90.75" height="8" rx="3" fill="var(--s1)"><title>TOAST: 1.86</title></rect>
<circle cx="205.56" cy="273" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="277" class="value" text-anchor="start">1.86</text>
<text x="148" y="301" class="" text-anchor="end">HEALPix</text>
<rect x="156.21" y="293" width="78.18" height="8" rx="3" fill="var(--s1)"><title>HEALPix: 1.36</title></rect>
<circle cx="176.62" cy="297" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="301" class="value" text-anchor="start">1.36</text>
<text x="148" y="325" class="" text-anchor="end">Icosahedral rhombus</text>
<rect x="177.96" y="317" width="35.48" height="8" rx="3" fill="var(--s1)"><title>Icosahedral rhombus: 1.76</title></rect>
<circle cx="199.52" cy="321" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="325" class="value" text-anchor="start">1.76</text>
<text x="148" y="349" class="" text-anchor="end">Icosahedral triangle</text>
<rect x="156.15" y="341" width="9.87" height="8" rx="3" fill="var(--s1)"><title>Icosahedral triangle: 1.11</title></rect>
<circle cx="162.28" cy="345" r="4.5" class="dot" fill="var(--ink)"/>
<text x="338" y="349" class="value" text-anchor="start">1.11</text>
<text x="242" y="388" class="tick" text-anchor="middle">long ÷ short axis</text>
<text x="388" y="107" class="panel-title" text-anchor="start">Samples spent ÷ ideal hexagonal lattice</text>
<line x1="528" y1="117" x2="528" y2="357" class="axis"/>
<text x="528" y="372" class="tick" text-anchor="middle">1</text>
<line x1="585.33" y1="117" x2="585.33" y2="357" class="grid"/>
<text x="585.33" y="372" class="tick" text-anchor="middle">2</text>
<line x1="642.67" y1="117" x2="642.67" y2="357" class="grid"/>
<text x="642.67" y="372" class="tick" text-anchor="middle">3</text>
<line x1="700" y1="117" x2="700" y2="357" class="grid"/>
<text x="700" y="372" class="tick" text-anchor="middle">4</text>
<text x="520" y="133" class="" text-anchor="end">Equirectangular</text>
<rect x="545.14" y="125" width="154.86" height="8" rx="3" fill="var(--s1)"><title>Equirectangular: 1.53</title></rect>
<circle cx="558.41" cy="129" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="133" class="value" text-anchor="start">1.53</text>
<text x="520" y="157" class="" text-anchor="end">Cubemap</text>
<rect x="528.16" y="149" width="19.11" height="8" rx="3" fill="var(--s1)"><title>Cubemap: 1.19</title></rect>
<circle cx="538.77" cy="153" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="157" class="value" text-anchor="start">1.19</text>
<text x="520" y="181" class="" text-anchor="end">Equi-angular cube</text>
<rect x="528.35" y="173" width="18.77" height="8" rx="3" fill="var(--s1)"><title>Equi-angular cube: 1.19</title></rect>
<circle cx="538.77" cy="177" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="181" class="value" text-anchor="start">1.19</text>
<text x="520" y="205" class="" text-anchor="end">QSC cube</text>
<rect x="535.52" y="197" width="11.53" height="8" rx="3" fill="var(--s1)"><title>QSC cube: 1.23</title></rect>
<circle cx="541.45" cy="201" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="205" class="value" text-anchor="start">1.23</text>
<text x="520" y="229" class="" text-anchor="end">Octahedral (L1)</text>
<rect x="528" y="221" width="13.08" height="8" rx="3" fill="var(--s1)"><title>Octahedral (L1): 1.03</title></rect>
<circle cx="529.55" cy="225" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="229" class="value" text-anchor="start">1.03</text>
<text x="520" y="253" class="" text-anchor="end">Octahedral equal-area</text>
<rect x="528.11" y="245" width="20.53" height="8" rx="3" fill="var(--s1)"><title>Octahedral equal-area: 1.12</title></rect>
<circle cx="535.02" cy="249" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="253" class="value" text-anchor="start">1.12</text>
<text x="520" y="277" class="" text-anchor="end">TOAST</text>
<rect x="528.01" y="269" width="16.9" height="8" rx="3" fill="var(--s1)"><title>TOAST: 1.10</title></rect>
<circle cx="533.74" cy="273" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="277" class="value" text-anchor="start">1.10</text>
<text x="520" y="301" class="" text-anchor="end">HEALPix</text>
<rect x="528.94" y="293" width="19.7" height="8" rx="3" fill="var(--s1)"><title>HEALPix: 1.16</title></rect>
<circle cx="536.96" cy="297" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="301" class="value" text-anchor="start">1.16</text>
<text x="520" y="325" class="" text-anchor="end">Icosahedral rhombus</text>
<rect x="528" y="317" width="2.46" height="8" rx="3" fill="var(--s1)"><title>Icosahedral rhombus: 1.02</title></rect>
<circle cx="529.01" cy="321" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="325" class="value" text-anchor="start">1.02</text>
<text x="520" y="349" class="" text-anchor="end">Icosahedral triangle</text>
<rect x="585.58" y="341" width="16.01" height="8" rx="3" fill="var(--s1)"><title>Icosahedral triangle: 2.18</title></rect>
<circle cx="595.87" cy="345" r="4.5" class="dot" fill="var(--ink)"/>
<text x="710" y="349" class="value" text-anchor="start">2.18</text>
<text x="614" y="388" class="tick" text-anchor="middle">1 is ideal; a square lattice is 1.30</text>
<text x="16" y="405" class="note" text-anchor="start">Equirectangular runs off both scales near the poles (elongation and excess above 100). The icosahedral rhombus has</text>
<text x="16" y="420" class="note" text-anchor="start">elongated cells and a nearly ideal lattice; triangle cells are the reverse: equal-sided cells whose centres form a</text>
<text x="16" y="435" class="note" text-anchor="start">honeycomb, which wastes half its samples by this measure.</text>
</svg>
