<text x="16" y="405" class="note" text-anchor="start">Below 1× needs fewer bytes than equirectangular. Triangle cells are stored two to a rhombus cell, side by side in a</text>
<text x="16" y="420" class="note" text-anchor="start">row, which is how a square-image codec has to be given them.</text>
