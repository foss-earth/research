<svg xmlns="http://www.w3.org/2000/svg" width="760" height="439" viewBox="0 0 760 439" role="img">
<style>
  :root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --quiet: #b5b3ab;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
    --s6: #008300;
    --s7: #4a3aa7;
    --s8: #e34948; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --quiet: #5c5b56;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s5: #d55181;
      --s6: #008300;
      --s7: #9085e9;
      --s8: #e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .subtitle { font-size: 12px; fill: var(--ink2); }
  .panel-title { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .value { font-size: 11.5px; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .note { font-size: 11px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text x="16" y="24" class="title" text-anchor="start">Bytes for equal view quality, relative to equirectangular</text>
<text x="16" y="44" class="subtitle" text-anchor="start">For each panorama, the quality equirectangular reaches at 2560 × 1280 and quality 75 is the target; each</text>
<text x="16" y="61" class="subtitle" text-anchor="start">representation's bytes to reach it are read off its own best curve with the same codec. Geometric mean over</text>
<text x="16" y="78" class="subtitle" text-anchor="start">6 panoramas.</text>
<text x="16" y="107" class="panel-title" text-anchor="start">JPEG 4:2:0, matched by PSNR</text>
