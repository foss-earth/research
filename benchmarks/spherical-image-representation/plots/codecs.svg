<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img">
<style>
  :root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --quiet: #b5b3ab;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
    --s6: #008300;
    --s7: #4a3aa7;
    --s8: #e34948; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --quiet: #5c5b56;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s5: #d55181;
      --s6: #008300;
      --s7: #9085e9;
      --s8: #e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .subtitle { font-size: 12px; fill: var(--ink2); }
  .panel-title { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .value { font-size: 11.5px; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .note { font-size: 11px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text x="16" y="24" class="title" text-anchor="start">The same samples under four codecs</text>
<text x="16" y="44" class="subtitle" text-anchor="start">Cubemap, 768 px faces. View PSNR against bytes for the whole sphere, mean of 6 panoramas. AVIF is macOS's</text>
<text x="16" y="61" class="subtitle" text-anchor="start">encoder through sips, at three qualities.</text>
<line x1="16" y1="84" x2="34" y2="84" class="line" stroke="var(--s1)"/><circle cx="25" cy="84" r="4" class="dot" fill="var(--s1)"/>
<text x="40" y="88" class="" text-anchor="start">JPEG 4:2:0</text>
<line x1="127.2" y1="84" x2="145.2" y2="84" class="line" stroke="var(--s2)"/><circle cx="136.2" cy="84" r="4" class="dot" fill="var(--s2)"/>
<text x="151.2" y="88" class="" text-anchor="start">WebP</text>
<line x1="198.08" y1="84" x2="216.08" y2="84" class="line" stroke="var(--s3)"/><circle cx="207.08" cy="84" r="4" class="dot" fill="var(--s3)"/>
<text x="222.08" y="88" class="" text-anchor="start">AVIF</text>
<line x1="268.96" y1="84" x2="286.96" y2="84" class="line" stroke="var(--quiet)"/><circle cx="277.96" cy="84" r="4" class="dot" fill="var(--quiet)"/>
<text x="292.96" y="88" class="" text-anchor="start">JPEG 4:4:4</text>
