<text x="304.82" y="366" class="tick" text-anchor="middle">512 KiB</text>
<line x1="467.15" y1="350" x2="467.15" y2="354" class="axis"/>
<text x="467.15" y="366" class="tick" text-anchor="middle">1024 KiB</text>
