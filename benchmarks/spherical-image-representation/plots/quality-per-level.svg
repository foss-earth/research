<text x="16" y="434" class="note" text-anchor="start">A residual scheme's coarse levels cost more than a replacement scheme's, because they are stored precisely enough to</text>
<text x="16" y="449" class="note" text-anchor="start">be refined; it overtakes once the finer levels arrive.</text>
</svg>
