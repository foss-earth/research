<text x="16" y="44" class="subtitle" text-anchor="start">A 1080 × 2400 view on this desktop GPU, headless Chrome. The extra GPU time per additional blended copy of</text>
<text x="16" y="61" class="subtitle" text-anchor="start">the panorama in the frame, which isolates the panorama from the frame's fixed cost. WebGL 1's timer gave no</text>
