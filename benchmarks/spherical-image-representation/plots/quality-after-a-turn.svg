<text x="16" y="24" class="title" text-anchor="start">What a turn would reveal</text>
<text x="16" y="44" class="subtitle" text-anchor="start">The same bytes, sent with one view first: quality of that view, and of the view facing the opposite way,</text>
<text x="16" y="61" class="subtitle" text-anchor="start">which has received nothing but what the whole sphere got. Cubemap, mean of 12 views of 6 panoramas.</text>
